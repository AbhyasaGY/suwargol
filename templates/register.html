<!doctype html>
<html lang="id">
    <head>
        <title>Register - SuWarGol</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light d-flex align-items-center vh-100">
        <div class="container text-center" style="max-width: 400px">
            <h2>Daftar Akun Baru</h2>
            <div class="card p-4 mt-3 shadow-sm">
                <form method="POST" action="/register">
                    <input type="text" name="username" class="form-control mb-3" placeholder="Buat Username" required />
                    <input type="password" name="password" class="form-control mb-3" placeholder="Buat Password" required />
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
                <p class="mt-3">Sudah punya akun? <a href="/login">Login</a></p>
            </div>
        </div>
    </body>
</html>
