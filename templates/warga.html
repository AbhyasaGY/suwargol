<!doctype html>
<html lang="id">
    <head>
        <title>Dashboard Warga</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="d-flex justify-content-between mb-4">
                <h3>Selamat datang, {{ session['username'] }}</h3>
                <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="card p-3">
                        <h5>Buat Laporan Baru</h5>
                        <form action="/submit_laporan" method="post" enctype="multipart/form-data">
                            <input type="text" name="nama" class="form-control mb-2" placeholder="Nama Lengkap" required />
                            <textarea name="laporan" class="form-control mb-2" placeholder="Detail Keluhan" required></textarea>
                            <input type="file" name="foto" class="form-control mb-3" accept="image/*" required />
                            <button type="submit" class="btn btn-primary w-100">Kirim & Upload ke S3</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-3">
                        <h5>Tracking Laporan Saya</h5>
                        <table class="table">
                            <tr>
                                <th>Laporan</th>
                                <th>Status</th>
                                <th>Bukti (CloudFront)</th>
                            </tr>
                            {% for r in reports %}
                            <tr>
                                <td>{{ r.isi_laporan }}</td>
                                <td><b>{{ r.status }}</b></td>
                                <td><a href="https://{{ cf_domain }}/{{ r.foto_url }}" target="_blank" class="btn btn-sm btn-info">Lihat Foto</a></td>
                            </tr>
                            {% endfor %}
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
