<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SuWarGol - Suara Warga Regol</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            .hero-section {
                background: #f8f9fa;
                padding: 40px 0;
                border-bottom: 3px solid #007bff;
            }
            .card-report {
                border-radius: 15px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
        </style>
    </head>
    <body>
        <div class="hero-section text-center">
            <h1>📢 SuWarGol</h1>
            <p class="lead">Sistem Pengaduan Masyarakat Kecamatan Regol</p>
        </div>

        <div class="container my-5">
            <div class="row">
                <div class="col-md-5">
                    <div class="card card-report p-4 mb-4">
                        <h4 class="mb-3">Kirim Laporan</h4>
                        <form action="/submit" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Nama Pelapor</label>
                                <input type="text" name="nama" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Detail Keluhan</label>
                                <textarea name="laporan" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Bukti Foto (Upload ke S3)</label>
                                <input type="file" name="foto" class="form-control" accept="image/*" required />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Kirim Pengaduan</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card p-4">
                        <h4 class="mb-3">Status Laporan (Terbaru)</h4>
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Nama</th>
                                    <th>Laporan</th>
                                    <th>Status</th>
                                    <th>Bukti (CDN)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Contoh Warga</td>
                                    <td>Jalan berlubang di Jl. Regol</td>
                                    <td><span class="badge bg-warning text-dark">Diproses</span></td>
                                    <td><a href="#" class="btn btn-sm btn-outline-info">Lihat Foto</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
