<!doctype html>
<html lang="id">
    <head>
        <title>Dashboard Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-dark text-white">
        <div class="container mt-5">
            <div class="d-flex justify-content-between mb-4">
                <h3>Panel Admin SuWarGol</h3>
                <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
            <div class="card p-3 text-dark">
                <h5>Semua Laporan Warga</h5>
                <table class="table">
                    <tr>
                        <th>Nama</th>
                        <th>Keluhan</th>
                        <th>Foto (CDN)</th>
                        <th>Status Saat Ini</th>
                        <th>Ubah Status</th>
                    </tr>
                    {% for r in reports %}
                    <tr>
                        <td>{{ r.nama_pelapor }}</td>
                        <td>{{ r.isi_laporan }}</td>
                        <td><a href="https://{{ cf_domain }}/{{ r.foto_url }}" target="_blank">Lihat</a></td>
                        <td>{{ r.status }}</td>
                        <td>
                            <form action="/update_status/{{ r.id }}" method="post" class="d-flex">
                                <select name="status" class="form-select form-select-sm me-2">
                                    <option value="Menunggu">Menunggu</option>
                                    <option value="Diproses">Diproses</option>
                                    <option value="Selesai">Selesai</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-warning">Update</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </body>
</html>
